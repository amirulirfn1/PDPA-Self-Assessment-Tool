name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - PDPA-Self-Assessment-Tool

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install app dependencies
        run: npm --prefix auditless-app install

      - name: Install functions dependencies
        run: npm --prefix functions install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
